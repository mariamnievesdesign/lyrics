name: Compilar Letras

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar Letras
        run: >
          dotnet publish src/Letras/Letras.csproj -c Release -r win-x64
          -p:Platform=x64 --self-contained true -o out/Letras

      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path out/Letras -DestinationPath Letras.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Letras
          path: Letras.zip

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Letras v0.2.${{ github.run_number }}
          files: Letras.zip
