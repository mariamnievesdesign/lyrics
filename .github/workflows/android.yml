name: Compilar Letras Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk ../Letras.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Letras-android
          path: Letras.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: Letras Android v0.1.${{ github.run_number }}
          files: Letras.apk
          make_latest: false
